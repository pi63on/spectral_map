	<text transform="matrix(0.9927 0 0 1 1006.2617 666.6353)" class="st2 st12 st13">(from ‘A CD Spectrometer’, Jerry Xiaojin Zhu, </text>
</g>
<g>
	<text transform="matrix(0.9927 0 0 1 1006.2617 685.9321)" class="st2 st12 st13">https://www.cs.cmu.edu/~zhuxj/astro/html/spectrometer.html)</text>
