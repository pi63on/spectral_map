<text transform="matrix(0.9833 0 0 1 42.2998 720.6434)" class="st2 st3 st6">Sodium vapor lamps are famous for their colour spectrum. Sodium vapor emits very intense light at two neighboring orange peaks, with approximately 589 and 589.6 nanometers.</text>
