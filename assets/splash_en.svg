<rect x="42.3" y="919.8" class="st5" width="1427.6" height="141.7"/>
<text transform="matrix(0.9833 0 0 1 42.3 931.258)"><tspan x="0" y="0" class="st2 st3 st6">Their light, therefore, appears as distinctly orange to the eye. For the purposes of street lighting high pressure versions with additives tend to be used, so as to improve their warm-up time and visibility. This </tspan><tspan x="0" y="19.2" class="st2 st3 st6">adds other smaller peaks to the orange doublet. The produced light, however, remains as iconic as orange and strongly associated with local streets at night.</tspan><tspan x="0" y="44.4" class="st2 st3 st6">Starting in 2024, Bratislava has slowly been seeing the phasing out of these lamps and modernisation. To translate the City of Bratislava on this matter (bratislava.sk, 25.10.2025):</tspan><tspan x="0" y="69.6" class="st2 st3 st6">“There’s more than 9 000 light sources in Petržalka, with more than 4 000 already having been replaced. In this district, as well, a larger modernisation has been underway since September, which will see </tspan><tspan x="0" y="88.8" class="st2 st3 st6">the replacement of approximately 5000 light sources and at which end the whole district will be lit up with LEDs”</tspan></text>
