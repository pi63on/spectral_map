<rect x="42.3" y="142.3" class="st5" width="1427.6" height="123.9"/>
<text transform="matrix(0.9833 0 0 1 42.2998 153.7559)"><tspan x="0" y="0" class="st2 st3 st6">The webpage maps street lighting in Petržalka (a district of Bratislava) on a circuit from Farského - Chorvátske rameno I. - Park obetí hraničiarov up to Pankúchová. The points on the map are projected </tspan><tspan x="0" y="19.2" class="st2 st3 st6">according to their geographical coordinates.</tspan><tspan x="0" y="44.4" class="st2 st3 st6">Each point represents a source of light in a given location, whether new LED lighting, ads or sodium lamps. Together with a photo of the spot, the spectrum of the light source is recorded. The intensity of </tspan><tspan x="0" y="63.6" class="st2 st3 st6">light for wavelengths in the range of approximately 300 to 900 nanometers is measured. The range of 400 - 700 nm constitutes the visible spectrum.</tspan></text>
