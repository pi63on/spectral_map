<g>
	<rect x="42.3" y="382.6" class="st5" width="1427.6" height="101.5"/>
	<text transform="matrix(0.9833 0 0 1 42.2998 394.0526)"><tspan x="0" y="0" class="st2 st3 st6">Monochromatic light (light of a single colour) is electromagnetic radiation of a single wavelength, so a single sinusoid oscillating infinitely in time. This is, in reality, only attainable to a certain degree. Lasers </tspan><tspan x="0" y="19.2" class="st2 st3 st6">come closest and have been, as an idea, invented in the 1950s. Their price can, depending on their quality, go up to hundreds of thousands of EUR.</tspan><tspan x="0" y="44.4" class="st2 st3 st6">White light consists of multiple colours of light (wavelengths) with a comparable intensity. These go on to additively mix in our eye and give the perception of white light. Empirically, we distinguish between </tspan><tspan x="0" y="63.6" class="st2 st3 st6">different qualities of white light, such as warm or cold light. As an example, below is the spectrum of sun at noon (warm white light) and at sunset (orange-red light). The blue and violet parts of the spectrum </tspan><tspan x="0" y="82.8" class="st2 st3 st6">at sunset are visibly less intense.</tspan></text>
</g>
<rect x="1674.3" y="353.2" class="st5" width="223" height="69.9"/>
<text transform="matrix(0.9833 0 0 1 1674.2998 366.6846)"><tspan x="0" y="0" class="st3 st17">Lorem ipsum dolor sit </tspan><tspan x="0" y="22.6" class="st3 st17">amet, consectetuer adip</tspan><tspan x="201" y="22.6" class="st3 st17">-</tspan><tspan x="0" y="45.2" class="st3 st17">iscing elit, sed diam </tspan></text>
<text transform="matrix(0.9833 0 0 1 1726.1261 366.6455)" class="st18"><tspan x="0" y="0" class="st2 st3 st17">choose points on the</tspan><tspan x="14.7" y="22.6" class="st2 st3 st17">map with mouse or</tspan><tspan x="-32.4" y="45.2" class="st2 st3 st17">navigate with arrow keys</tspan></text>
<text transform="matrix(0.9833 0 0 1 1680.4414 1004.334)" class="st2 st3 st17">Alex P., VŠVU/AFAD 2025</text>
<text transform="matrix(0.9833 0 0 1 1766.5234 1027.6816)" class="st2 st3 st17">pi63on.github.io</text>
