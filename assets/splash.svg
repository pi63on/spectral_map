			<rect x="1034.7" y="770" class="st9" width="417.3" height="61.6"/>
			<text transform="matrix(1 0 0 1 1034.7422 808.7402)" class="st2 st18 st19">(z ‘A CD Spectrometer’, Jerry Xiaojin Zhu, </text>
			<text transform="matrix(1 0 0 1 1034.7422 826.7402)" class="st2 st18 st19">https://www.cs.cmu.edu/~zhuxj/astro/html/spectrometer.html)</text>
		</g>
		<rect x="129" y="498.2" class="st9" width="1311" height="134.8"/>
		<text transform="matrix(1 0 0 1 129 510.333)" class="st2 st3 st12">Monochromatické, teda jednofarebné svetlo, je také, ktoré pozostáva z čisto jednej vlnovej dĺžky teda jednej sínusoidy oscilujúcej nekonečne v čase. V praxi je to však </text>
		<text transform="matrix(1 0 0 1 129 530.733)" class="st2 st3 st12">nedosiahnuteľné iba do nejakej roviny a najviac sa tomu približujú lasere, ktoré sa začali vyvíjať od 50tych rokov a ich cena sa vie pri lepších kusoch vyšplhať na niekoľko 100 </text>
		<text transform="matrix(1 0 0 1 129 551.133)" class="st2 st3 st12">000 EUR. </text>
		<text transform="matrix(1 0 0 1 129 581.533)" class="st2 st3 st12">Biele svetlo pozostáva z viacerých farieb svetla (teda vlnových dĺžok). Na základe princípu aditívneho miešania farieb (začo vďačíme nášmu oku) sa dokopy javia ako biele, </text>
		<text transform="matrix(1 0 0 1 129 601.933)" class="st2 st3 st12">avšak nie je biele svetlo ako biele svetlo, hovoríme o napr. teplom a studenom svetle.</text>
		<text transform="matrix(1 0 0 1 129 632.333)" class="st2 st3 st12">Pre ilustráciu, spektrum slnka na poľudnie (teplé biele svetlo) a pri západe (oranžovo-červené):</text>
	</g>
</g>
</svg>
