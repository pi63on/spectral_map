<rect x="42.3" y="142.3" class="st5" width="1427.6" height="123.9"/>
<text transform="matrix(0.9833 0 0 1 42.2998 153.7559)"><tspan x="0" y="0" class="st2 st3 st6">Webová stránka mapuje pouličné osvetlenie v Petržalke na okruhu od Farského - Chorvátske r. I. - Park obetí hraničiarov a po Pankúchovú. Body na mape sú projektované podľa ich geografických koor</tspan><tspan x="1424.1" y="0" class="st2 st3 st6">-</tspan><tspan x="0" y="19.2" class="st2 st3 st6">dinátov.</tspan><tspan x="0" y="38.4" class="st2 st3 st6">Každý bod, každé meranie, zaznamenáva jeden zdroj svetla v danej lokalite, či už nové LED lampy, reklamné tabule alebo sodíkové výbojky. Spolu s fotkou osvetleného prostredia je dokumentovaný aj </tspan><tspan x="0" y="57.6" class="st2 st3 st6">spektrogram svetelného zdroju.</tspan><tspan x="0" y="76.8" class="st2 st3 st6">Pri farebnom spektre ide o plot intenzity pre vlnové dĺžky od približne 300 do 900 nanometrov. Pre naše oko sú viditeľné vlnové dĺžky v rozsahu zhruba 400 - 700 nm.</tspan></text>
