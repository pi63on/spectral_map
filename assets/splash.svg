	<text transform="matrix(0.9927 0 0 1 795.7793 384.8916)" class="st2 st12 st13">obr. 1, sRGB rendering spektra viditeľného svetla (By Gringer - Own work, Public Domain, </text>
	<text transform="matrix(0.9927 0 0 1 795.7793 404.1895)" class="st2 st12 st13">https://commons.wikimedia.org/w/index.php?curid=4639774)</text>
