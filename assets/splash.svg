<rect x="42.3" y="798.2" class="st5" width="1427.6" height="189.8"/>
<text transform="matrix(0.9833 0 0 1 42.2998 809.6563)"><tspan x="0" y="0" class="st2 st3 st6">Sodíkové výbojky sú typické pre svoje farebné spektrum. Sodíkové výpary emitujú svetlo so silným dvojitým peakom pri 589.0 a 589.6 nanometroch. Pre pouličné osvetlenie sa používajú vysokotlakové </tspan><tspan x="0" y="19.2" class="st2 st3 st6">verzie s prímesami, pre lepší štart a lepšiu viditeľnosť, keďže sa pod monochromatickým svetlom nedajú rozoznávať farby. Aj s rozšíreným spektrom produkujú dištinktívne oranžové svetlo, ktoré je asocio</tspan><tspan x="1439.6" y="19.2" class="st2 st3 st6">-</tspan><tspan x="0" y="38.4" class="st2 st3 st6">vané s ulicami v noci.</tspan><tspan x="0" y="57.6" class="st2 st3 st6">K vymyznutiu oranžových ulíc z Bratislavy od začiatku modernizácie v roku 2024 citujem Mesto Bratislava (bratislava.sk, 25.10.2025):</tspan><tspan x="0" y="76.8" class="st2 st3 st6">“V Petržalke sa nachádza viac ako 9 000 svetelných bodov, pričom vymenených tu bolo už viac ako 4 000 svietidiel. Aj v tejto mestskej časti prebieha od septembra masívnejšia modernizácia, počas ktorej </tspan><tspan x="0" y="96" class="st2 st3 st6">bude vymenených približne 5000 svietidiel a na jej konci bude celá mestská časť osvetlená LED svietidlami.”</tspan></text>
