	<rect x="1489.7" y="878.5" class="st9" width="352.2" height="78.9"/>
	<text transform="matrix(0.9905 0 0 1 1531.8516 891.8662)" class="st2 st3 st4">Veľká vďaka Dr. Andrejovi Mosatovi a </text>
	<text transform="matrix(0.9905 0 0 1 1584.6689 914.3018)" class="st2 st3 st4">myspectral.com za zapožičanie </text>
	<text transform="matrix(0.9905 0 0 1 1663.916 936.7363)" class="st2 st3 st4">spektrometra Luminy.</text>
	<text transform="matrix(0.9905 0 0 1 30.2975 60.6794)" class="st2 st3 st10">Spektrálna mapa osvetlenia</text>
	<text transform="matrix(0.9905 0 0 1 30.2975 101.1872)" class="st2 st3 st10">Spectral Map of Street Lighting</text>
	<line class="st11" x1="1484.1" y1="72.5" x2="1484.1" y2="966.8"/>
	<g id="Layer_2_1_">
		<rect x="129" y="235" class="st9" width="1311" height="119"/>
		<text transform="matrix(1 0 0 1 129 247.1719)" class="st2 st3 st12">Webová stránka mapuje pouličné osvetlenie v Petržalke na okruhu od Farského - Chorvátske r. I. - Park obetí hraničiarov - po Pankúchovú. Body na mape sú projektované </text>
		<text transform="matrix(1 0 0 1 129 267.5719)" class="st2 st3 st12">podľa ich geografických koordinátov.</text>
		<text transform="matrix(1 0 0 1 129 297.9719)" class="st2 st3 st12">Každý bod, každé meranie, zaznamenáva jeden zdroj svetla v danej lokalite, či už nové LED lampy, reklamné tabule alebo sodíkové výbojky. Spolu s fotkou osvetleného </text>
		<text transform="matrix(1 0 0 1 129 318.3719)" class="st2 st3 st12">prostredia je dokumentovaný aj spektrogram svetelného zdroju.</text>
		<text transform="matrix(1 0 0 1 129 348.7719)" class="st2 st3 st12">Pri farebnom spektre ide o plot intenzity pre vlnové dĺžky od približne 300 do 900 nanometrov. Pre naše oko sú viditeľné vlnové dĺžky v rozsahu zhruba 400 - 700 nm. </text>
