<g>
	<rect x="42.3" y="425.8" class="st5" width="1427.6" height="145.7"/>
	<text transform="matrix(0.9833 0 0 1 42.2998 437.2559)"><tspan x="0" y="0" class="st2 st3 st6">Monochromatické, teda jednofarebné svetlo, je také, ktoré pozostáva z čisto jednej vlnovej dĺžky teda jednej sínusoidy oscilujúcej nekonečne v čase. V praxi je to však nedosiahnuteľné iba do nejakej roviny </tspan><tspan x="0" y="19.2" class="st2 st3 st6">a najviac sa tomu približujú lasere, ktoré sa začali vyvíjať od 50tych rokov a ich cena sa vie pri lepších kusoch vyšplhať na niekoľko 100 000 EUR. </tspan><tspan x="0" y="38.4" class="st2 st3 st6">Biele svetlo pozostáva z viacerých farieb svetla (teda vlnových dĺžok). Na základe princípu aditívneho miešania farieb (začo vďačíme nášmu oku) sa dokopy javia ako biele, avšak nie je biele svetlo ako </tspan><tspan x="0" y="57.6" class="st2 st3 st6">biele svetlo, hovoríme o napr. teplom a studenom svetle.</tspan><tspan x="0" y="76.8" class="st2 st3 st6">Pre ilustráciu, spektrum slnka na poľudnie (teplé biele svetlo) a pri západe (oranžovo-červené). </tspan></text>
</g>
