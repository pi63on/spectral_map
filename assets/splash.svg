			<rect x="837" y="454" class="st9" width="641" height="30"/>
			<text transform="matrix(1 0 0 1 836.9678 464.7397)" class="st2 st18 st19">obr. 1, sRGB rendering spektra viditeľného svetla (By Gringer - Own work, Public Domain, </text>
			<text transform="matrix(1 0 0 1 836.9678 482.7397)" class="st2 st18 st19">https://commons.wikimedia.org/w/index.php?curid=4639774)</text>
		</g>
		<rect x="129" y="843.7" class="st9" width="1311" height="140.3"/>
		<text transform="matrix(1 0 0 1 129.0001 855.8408)" class="st2 st3 st12">Sodíkové výbojky sú typické pre svoje farebné spektrum. Sodíkové výpary emitujú svetlo so silným dvojitým peakom pri 589.0 a 589.6 nanometroch. Pre pouličné osvetlenie </text>
		<text transform="matrix(1 0 0 1 129.0001 876.2408)" class="st2 st3 st12">sa používajú vysokotlakové verzie s prímesami, pre lepší štart a lepšiu viditeľnosť, keďže sa pod monochromatickým svetlom nedajú rozoznávať farby. Aj s rozšíreným </text>
		<text transform="matrix(1 0 0 1 129.0001 896.6408)" class="st2 st3 st12">spektrom produkujú dištinktívne oranžové svetlo, ktoré je asociované s ulicami v noci.</text>
		<text transform="matrix(1 0 0 1 129.0001 927.0408)" class="st2 st3 st12">K vymyznutiu oranžových ulíc z Bratislavy od začiatku modernizácie v roku 2024 citujem Mesto Bratislava (bratislava.sk, 25.10.2025):</text>
		<text transform="matrix(1 0 0 1 129.0001 957.4408)" class="st2 st3 st12">“V Petržalke sa nachádza viac ako 9 000 svetelných bodov, pričom vymenených tu bolo už viac ako 4 000 svietidiel. Aj v tejto mestskej časti prebieha od septembra </text>
		<text transform="matrix(1 0 0 1 129.0001 977.8408)" class="st2 st3 st12">masívnejšia modernizácia, počas ktorej bude vymenených približne 5000 svietidiel a na jej konci bude celá mestská časť osvetlená LED svietidlami.”</text>
		<g>
