		<text transform="matrix(1 0 0 1 425.8389 809.1276)" class="st2 st18 st19">obr. 2, spektrum </text>
		<text transform="matrix(1 0 0 1 425.8389 827.1276)" class="st2 st18 st19">slnka na poludnie</text>
